<style>
:root {
  /* Stile della locandina del circolo: fondo blu in sfumatura, titoli condensati bianchi, etichette a pillola, schede bianche con testo blu e fascia bianca in basso */
  --blue: #0a5ad4;
  --blue-deep: #0848b4;
  --navy: #0b2a6e;
  --white: #ffffff;
  --mist: #d6e4ff;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Inter", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--navy); color: var(--white); overflow: hidden; font-family: var(--body); }
#viewport {
  position: fixed; inset: 0; overflow: hidden;
  background:
    linear-gradient(180deg, rgba(9,62,168,.72) 0%, rgba(10,86,206,.86) 40%, rgba(10,90,212,.95) 65%, #075fd8 100%),
    url("assets/sfondo.jpg") center top / cover no-repeat,
    var(--blue);
}
#stage {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%;
  transform-origin: center center; overflow: hidden;
  display: grid; grid-template-rows: 130px 1fr 110px;
  background:
    linear-gradient(180deg, rgba(9,62,168,.60) 0%, rgba(10,86,206,.80) 38%, rgba(10,90,212,.93) 62%, #075fd8 100%),
    url("assets/sfondo.jpg") center top / cover no-repeat,
    var(--blue);
}
/* righe del campo, discrete, come nella locandina */
#stage::before {
  content: ""; position: absolute; left: 0; right: 0; top: 620px; height: 2px; background: rgba(255,255,255,.12); pointer-events: none;
}
#stage::after {
  content: ""; position: absolute; left: 0; bottom: 110px; width: 520px; height: 360px; pointer-events: none;
  background: linear-gradient(135deg, transparent 50%, rgba(8,72,180,.55) 50%);
}
header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 80px; }
.brand { display: flex; align-items: center; gap: 22px; }
.brand-mark { width: 96px; height: 82px; flex: none; }
.brand-name { font-family: var(--body); font-weight: 800; font-size: 46px; letter-spacing: 1px; line-height: 1; }
.brand-sub { font-size: 18px; color: var(--mist); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; font-weight: 600; }
.clock { text-align: right; }
.clock-time { font-family: var(--display); font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-date { font-size: 22px; color: var(--mist); text-transform: capitalize; font-weight: 600; margin-top: 4px; }

main { position: relative; z-index: 1; }
.slide {
  position: absolute; inset: 0; padding: 30px 96px 60px;
  opacity: 0; transform: translateX(40px); transition: opacity .9s ease, transform .9s ease;
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 80px; align-items: center;
}
.slide.active { opacity: 1; transform: none; }
.slide.single { grid-template-columns: 1fr; }
.kicker {
  display: inline-block; background: var(--white); color: var(--blue); font-weight: 800; font-size: 26px;
  letter-spacing: 3px; text-transform: uppercase; padding: 12px 28px; border-radius: 999px;
}
h1.lungo { font-size: 124px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 150px; line-height: .9; text-transform: uppercase; margin: 26px 0 30px; text-wrap: balance; }
.lead-row { display: flex; gap: 28px; align-items: flex-start; }
.lead-row::before { content: ""; flex: none; width: 64px; height: 6px; border-radius: 3px; background: var(--white); margin-top: 22px; }
.lead { font-size: 36px; line-height: 1.4; color: var(--white); font-weight: 500; max-width: 30ch; }
.facts { display: grid; gap: 20px; }
.fact {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
  padding: 26px 34px; background: var(--white); color: var(--navy); border-radius: 22px;
}
.fact:last-child:not(:first-child) { background: var(--navy); color: var(--white); }
.fact:last-child:not(:first-child) .fact-value { color: var(--white); }
.fact:last-child:not(:first-child) .fact-note { color: var(--mist); }
.facts.compact { gap: 14px; }
.facts.compact .fact { padding: 18px 32px; }
.facts.compact .fact-label { font-size: 30px; }
.fact-label { font-size: 34px; font-weight: 800; line-height: 1.15; }
.fact-note { display: block; font-size: 22px; font-weight: 700; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
.fact-value { font-family: var(--display); font-size: 70px; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.chip { font-size: 26px; font-weight: 700; padding: 12px 26px; border: 3px solid var(--white); border-radius: 999px; }
.cta { margin-top: 30px; display: inline-block; font-size: 30px; font-weight: 800; background: var(--navy); color: var(--white); padding: 18px 34px; border-radius: 18px; }

.ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.ig-tile {
  aspect-ratio: 1; border-radius: 18px; background: rgba(255,255,255,.12); overflow: hidden; position: relative;
  display: grid; place-items: center; color: var(--mist); font-size: 22px; text-align: center; padding: 16px; font-weight: 600;
}
.ig-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ig-row { display: flex; align-items: center; gap: 32px; margin-top: 36px; }
.ig-qr { flex: none; background: #fff; padding: 14px; border-radius: 18px; width: 228px; height: 228px; }
.ig-qr img, .ig-qr canvas { display: block; width: 200px; height: 200px; }
.ig-handle { font-family: var(--display); font-size: 66px; margin-top: 6px; }

.sponsor-grid { display: grid; gap: 22px; }
.sponsor-grid.due { grid-template-columns: 1fr 1fr; }
.sponsor-grid.due .sponsor-card { height: 260px; padding: 30px; }
.sponsor-card { height: 220px; border-radius: 22px; display: grid; place-items: center; padding: 30px 50px; box-shadow: 0 20px 50px rgba(11,42,110,.3); }
.sponsor-card img { max-width: 100%; max-height: 160px; object-fit: contain; }
.locandina { grid-template-columns: 1fr; place-items: center; padding: 20px 96px 40px; }
.locandina img { max-height: 830px; max-width: 100%; border-radius: 20px; border: 10px solid var(--white); box-shadow: 0 30px 70px rgba(11,42,110,.45); }
.post { grid-template-columns: 640px 1fr; gap: 90px; }
.post.con-immagine { grid-template-columns: 1fr 640px; }
.post-media { width: 640px; height: 800px; border-radius: 26px; overflow: hidden; background: var(--white); border: 10px solid var(--white); box-shadow: 0 30px 70px rgba(11,42,110,.45); }
.post-media img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 16px; background: var(--white); }
.post-caption { margin-top: 30px; font-size: 38px; line-height: 1.4; font-weight: 500; max-width: 32ch; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.post-date { font-size: 26px; color: var(--mist); margin-top: 26px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

footer { position: relative; z-index: 2; display: flex; align-items: center; background: var(--white); color: var(--navy); overflow: hidden; }
.footer-label { flex: none; height: 100%; display: flex; align-items: center; padding: 0 44px 0 80px; color: var(--blue); font-family: var(--display); font-size: 52px; text-transform: uppercase; }
.ticker { flex: 1; overflow: hidden; white-space: nowrap; }
.ticker-track { display: inline-block; padding-left: 100%; font-size: 32px; font-weight: 700; animation: scroll 60s linear infinite; }
.ticker-track span { margin-right: 90px; }
.ticker-track span::before { content: ""; display: inline-block; width: 40px; height: 5px; border-radius: 3px; background: var(--blue); margin-right: 22px; vertical-align: middle; }
@keyframes scroll { to { transform: translateX(-100%); } }

.progress { position: absolute; left: 0; bottom: 110px; height: 6px; background: var(--white); width: 0; z-index: 3; }
.dots { position: absolute; left: 50%; transform: translateX(-50%); bottom: 124px; display: flex; gap: 12px; z-index: 3; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.3); }
.dot.on { background: var(--white); }

@media (prefers-reduced-motion: reduce) {
  .slide { transition: none; transform: none; }
  .ticker-track { animation-duration: 120s; }
}
</style>

const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };

function renderTesto(s) {
  const slide = el("section", "slide");
  const left = el("div");
  const lr = el("div", "lead-row"); lr.append(el("p", "lead", s.testo));
  const h = el("h1", null, s.titolo); if (s.titolo.length > 22) h.classList.add("lungo");
  left.append(el("div", "kicker", s.kicker), h, lr);
  slide.append(left);
  const right = el("div", "facts" + ((s.fatti || []).length > 4 ? " compact" : ""));
  (s.fatti || []).forEach(f => {
    const row = el("div", "fact");
    const lab = el("div", "fact-label", f.label);
    if (f.note) lab.append(el("span", "fact-note", f.note));
    row.append(lab);
    if (f.value) row.append(el("div", "fact-value", f.value));
    right.append(row);
  });
  if (s.chips && s.fatti) {
    left.append(Object.assign(el("div", "chips"), {}));
    s.chips.forEach(c => left.lastChild.append(el("span", "chip", c)));
  } else if (s.chips) {
    const ch = el("div", "chips"); s.chips.forEach(c => ch.append(el("span", "chip", c))); right.append(ch);
  }
  if (s.cta) left.append(el("div", "cta", s.cta));
  if (s.immagine) {
    const media = el("div", "post-media");
    const img = new Image(); img.src = s.immagine; img.alt = s.titolo; media.append(img);
    slide.classList.add("post", "con-immagine"); slide.append(left, media);
    left.remove(); slide.prepend(left);
  } else if (!right.children.length) slide.classList.add("single"); else slide.append(right);
  return slide;
}

function renderSponsor(s) {
  const slide = el("section", "slide");
  const left = el("div");
  const lr = el("div", "lead-row"); lr.append(el("p", "lead", s.testo));
  left.append(el("div", "kicker", s.kicker), el("h1", null, s.titolo), lr);
  const grid = el("div", "sponsor-grid" + (s.sponsor.length > 3 ? " due" : ""));
  s.sponsor.forEach(sp => {
    const card = el("div", "sponsor-card"); card.style.background = sp.sfondo || "#fff";
    const img = new Image(); img.src = sp.logo; img.alt = sp.nome; card.append(img);
    grid.append(card);
  });
  slide.append(left, grid);
  return slide;
}

function renderEventi() {
  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const prossimi = BACHECA.eventi.filter(e => new Date(e.data + "T23:59:00") >= oggi)
    .sort((a, b) => a.data.localeCompare(b.data)).slice(0, 6);
  if (!prossimi.length) return null;
  const slide = el("section", "slide");
  const left = el("div");
  left.append(el("div", "kicker", "Calendario eventi"), el("h1", null, "Prossimi appuntamenti"));
  const lr = el("div", "lead-row"); lr.append(el("p", "lead", "Tornei interni e fuori dal circolo: iscriviti in segreteria."));
  left.append(lr);
  const right = el("div", "facts");
  prossimi.forEach(e => {
    const d = new Date(e.data + "T12:00:00");
    const row = el("div", "fact");
    const lab = el("div", "fact-label", e.titolo);
    if (e.luogo) lab.append(el("span", "fact-note", e.luogo));
    row.append(lab, el("div", "fact-value", d.toLocaleDateString("it-IT", { day: "numeric", month: "short" })));
    right.append(row);
  });
  slide.append(left, right);
  return slide;
}

function renderLocandina(l) {
  const slide = el("section", "slide locandina");
  const img = new Image(); img.src = l.immagine; img.alt = l.titolo || "Locandina";
  slide.append(img);
  return slide;
}

function renderInstagram() {
  const slide = el("section", "slide");
  const left = el("div");
  left.append(el("div", "kicker", "Instagram"), el("h1", null, "Seguici su Instagram"),
    el("p", "lead", "Tornei, risultati, foto dei corsi e novità del circolo."));
  if (BACHECA.instagram) {
    const row = el("div", "ig-row");
    const qr = el("div", "ig-qr");
    try { new QRCode(qr, { text: "https://www.instagram.com/" + BACHECA.instagram + "/", width: 200, height: 200, colorDark: "#06177a", colorLight: "#ffffff" }); } catch (e) {}
    const info = el("div");
    info.append(el("div", "fact-note", "Inquadra il codice"), el("div", "ig-handle", "@" + BACHECA.instagram));
    row.append(qr, info);
    left.append(row);
  }
  const grid = el("div", "ig-grid");
  const posts = POSTS.slice(0, 6).map(p => p.image);
  for (let i = 0; i < 6; i++) {
    const t = el("div", "ig-tile");
    if (posts[i]) { const img = new Image(); img.src = posts[i]; img.alt = "Post Instagram del circolo"; t.append(img); }
    else t.textContent = "Ultimi post del circolo";
    grid.append(t);
  }
  slide.append(left, grid);
  return slide;
}

let POSTS = [];

function renderPost(p) {
  const slide = el("section", "slide post");
  const media = el("div", "post-media");
  const img = new Image(); img.src = p.image; img.alt = "Post Instagram del circolo"; media.append(img);
  const right = el("div");
  right.append(el("div", "kicker", "Dal nostro Instagram"));
  right.append(el("p", "post-caption", (p.caption || "").trim()));
  if (p.timestamp) right.append(el("div", "post-date", new Date(p.timestamp).toLocaleDateString("it-IT", { day: "numeric", month: "long", timeZone: "Europe/Rome" })));
  if (BACHECA.instagram) right.append(el("div", "ig-handle", "@" + BACHECA.instagram));
  slide.append(media, right);
  return slide;
}

const box = document.getElementById("slides");
const dots = document.getElementById("dots");
const progress = document.getElementById("progress");
let nodes = [], idx = 0;

function build() {
  const servizi = BACHECA.slide.map(s =>
    s.tipo === "instagram" ? renderInstagram() : s.tipo === "eventi" ? renderEventi() :
    s.tipo === "sponsor" ? renderSponsor(s) : renderTesto(s)
  ).filter(Boolean);
  const recenti = POSTS.slice(0, BACHECA.postInRotazione).map(renderPost);
  // alterna: servizio, post, servizio, post...
  nodes = [];
  const n = Math.max(servizi.length, recenti.length);
  for (let k = 0; k < n; k++) { if (servizi[k]) nodes.push(servizi[k]); if (recenti[k]) nodes.push(recenti[k]); }
  // distribuisce le locandine (sponsor) a intervalli regolari nella rotazione
  const loc = BACHECA.locandine.map(renderLocandina);
  if (loc.length) {
    const passo = Math.max(2, Math.floor(nodes.length / loc.length));
    loc.forEach((l, k) => nodes.splice(Math.min(nodes.length, (k + 1) * passo + k), 0, l));
  }
  box.replaceChildren(...nodes);
  dots.replaceChildren(...nodes.map(() => el("div", "dot")));
  document.getElementById("ticker").replaceChildren(...BACHECA.avvisi.map(a => el("span", null, a)));
}

function show(i) {
  nodes.forEach((n, k) => n.classList.toggle("active", k === i));
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  dots.style.visibility = nodes[i].classList.contains("locandina") ? "hidden" : "visible";
  progress.style.transition = "none"; progress.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    progress.style.transition = `width ${BACHECA.secondiPerSlide}s linear`;
    progress.style.width = "100%";
  }));
}

async function loadPosts() {
  try {
    const r = await fetch("instagram/posts.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) POSTS = (await r.json()).posts || [];
  } catch (e) { POSTS = []; }
}

(async () => {
  await loadPosts();
  build(); show(0);
  setInterval(() => { idx = (idx + 1) % nodes.length; show(idx); }, BACHECA.secondiPerSlide * 1000);
})();

/* Aggiornamento automatico: ogni 5 minuti controlla se la bacheca o i post sono cambiati e si ricarica */
const firme = {};
async function firma(url) {
  try { const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" }); return r.ok ? (await r.text()) : null; }
  catch (e) { return null; }
}
async function controllaAggiornamenti() {
  for (const url of ["index.html", "instagram/posts.json"]) {
    const t = await firma(url);
    if (t == null) continue;
    if (firme[url] != null && firme[url] !== t) { location.reload(); return; }
    firme[url] = t;
  }
}
controllaAggiornamenti();
setInterval(controllaAggiornamenti, 5 * 60 * 1000);
/* ricarica comunque una volta a notte, per sicurezza */
setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);

function tick() {
  const d = new Date();
  document.getElementById("time").textContent = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
  document.getElementById("date").textContent = d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Rome" });
}
tick(); setInterval(tick, 10000);

function fit() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}
fit(); window.addEventListener("resize", fit);
</script>
