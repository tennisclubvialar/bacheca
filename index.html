<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bacheca Vialar">
<meta name="theme-color" content="#0a5ad4">
<link rel="apple-touch-icon" href="assets/icona.png">
<title>Bacheca TC Vialar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html, body { cursor: none; }
:root {
  /* Stile della locandina del circolo: fondo blu in sfumatura, titoli condensati bianchi, etichette a pillola, schede bianche con testo blu e fascia bianca in basso */
  --blue: #0a5ad4;
  --blue-deep: #0848b4;
  --navy: #0b2a6e;
  --white: #ffffff;
  --mist: #d6e4ff;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --body: "Inter", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--navy); color: var(--white); overflow: hidden; font-family: var(--body); }
#viewport {
  position: fixed; inset: 0; overflow: hidden;
  background:
    linear-gradient(180deg, rgba(9,62,168,.72) 0%, rgba(10,86,206,.86) 40%, rgba(10,90,212,.95) 65%, #075fd8 100%),
    url("assets/sfondo.jpg") center top / cover no-repeat,
    var(--blue);
}
#stage {
  width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%;
  transform-origin: center center; overflow: hidden;
  display: grid; grid-template-rows: 130px 1fr 110px;
  background:
    linear-gradient(180deg, rgba(9,62,168,.60) 0%, rgba(10,86,206,.80) 38%, rgba(10,90,212,.93) 62%, #075fd8 100%),
    url("assets/sfondo.jpg") center top / cover no-repeat,
    var(--blue);
}
/* righe del campo, discrete, come nella locandina */
#stage::before {
  content: ""; position: absolute; left: 0; right: 0; top: 620px; height: 2px; background: rgba(255,255,255,.12); pointer-events: none;
}
#stage::after {
  content: ""; position: absolute; left: 0; bottom: 110px; width: 520px; height: 360px; pointer-events: none;
  background: linear-gradient(135deg, transparent 50%, rgba(8,72,180,.55) 50%);
}
header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 0 80px; }
.brand { display: flex; align-items: center; gap: 22px; }
.brand-mark { width: 96px; height: 82px; flex: none; }
.brand-name { font-family: var(--body); font-weight: 800; font-size: 46px; letter-spacing: 1px; line-height: 1; }
.brand-sub { font-size: 18px; color: var(--mist); letter-spacing: 3px; text-transform: uppercase; margin-top: 6px; font-weight: 600; }
.clock { text-align: right; }
.clock-time { font-family: var(--display); font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock-date { font-size: 22px; color: var(--mist); text-transform: capitalize; font-weight: 600; margin-top: 4px; }

main { position: relative; z-index: 1; }
.slide {
  position: absolute; inset: 0; padding: 30px 96px 60px;
  opacity: 0; transform: translateX(40px); transition: opacity .9s ease, transform .9s ease;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 80px; align-items: center;
}
.slide.active { opacity: 1; transform: none; }
.slide.single { grid-template-columns: 1fr; }
.kicker {
  display: inline-block; background: var(--white); color: var(--blue); font-weight: 800; font-size: 26px;
  letter-spacing: 3px; text-transform: uppercase; padding: 12px 28px; border-radius: 999px;
}
h1.lungo { font-size: 124px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 150px; line-height: .9; text-transform: uppercase; margin: 26px 0 30px; text-wrap: balance; }
.lead-row { display: flex; gap: 28px; align-items: flex-start; }
.lead-row::before { content: ""; flex: none; width: 64px; height: 6px; border-radius: 3px; background: var(--white); margin-top: 22px; }
.lead { font-size: 36px; line-height: 1.4; color: var(--white); font-weight: 500; max-width: 30ch; }
.facts { display: grid; gap: 20px; }
.fact {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px;
  padding: 26px 34px; background: var(--white); color: var(--navy); border-radius: 22px;
}
.fact:last-child:not(:first-child) { background: var(--navy); color: var(--white); }
.fact:last-child:not(:first-child) .fact-value { color: var(--white); }
.fact:last-child:not(:first-child) .fact-note { color: var(--mist); }
.facts.compact { gap: 14px; }
.facts.compact .fact { padding: 18px 32px; }
.facts.compact .fact-label { font-size: 30px; }
.fact-label { font-size: 34px; font-weight: 800; line-height: 1.15; }
.fact-note { display: block; font-size: 22px; font-weight: 700; color: var(--blue); letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
.fact-value { font-family: var(--display); font-size: 70px; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.chip { font-size: 26px; font-weight: 700; padding: 12px 26px; border: 3px solid var(--white); border-radius: 999px; }
.cta { margin-top: 30px; display: inline-block; font-size: 30px; font-weight: 800; background: var(--navy); color: var(--white); padding: 18px 34px; border-radius: 18px; }

.ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.ig-tile {
  aspect-ratio: 1; border-radius: 18px; background: rgba(255,255,255,.12); overflow: hidden; position: relative;
  display: grid; place-items: center; color: var(--mist); font-size: 22px; text-align: center; padding: 16px; font-weight: 600;
}
.ig-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ig-row { display: flex; align-items: center; gap: 32px; margin-top: 36px; }
.ig-qr { flex: none; background: #fff; padding: 14px; border-radius: 18px; width: 228px; height: 228px; }
.ig-qr img { display: block; width: 200px; height: 200px; image-rendering: pixelated; }
.qr-password { margin-top: 18px; display: grid; gap: 6px; }
.qr-password span { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--mist); }
.qr-password strong { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; background: #fff; color: var(--navy); padding: 10px 22px; border-radius: 14px; }
.post-qr { margin-top: 30px; }
.post .post-caption { -webkit-line-clamp: 6; }
.qr-testo { font-size: 30px; font-weight: 700; max-width: 16ch; line-height: 1.3; }
.ig-handle { font-family: var(--display); font-size: 66px; margin-top: 6px; }

.sponsor-slide { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: stretch; gap: 40px; padding-top: 20px; }
.sponsor-top { display: grid; grid-template-columns: auto 1fr; gap: 70px; align-items: end; }
.sponsor-top h1 { font-size: 130px; margin: 18px 0 0; }
.sponsor-top .lead-row { padding-bottom: 14px; }
.sponsor-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 26px; }
.sponsor-card { border-radius: 26px; display: grid; place-items: center; padding: 34px 56px; box-shadow: 0 22px 50px rgba(6,23,122,.35); min-height: 0; }
.sponsor-card img { max-width: 100%; max-height: 190px; object-fit: contain; }
.sponsor-card.invito { background: transparent !important; border: 4px dashed rgba(255,255,255,.7); box-shadow: none; text-align: center; align-content: center; gap: 14px; }
.sponsor-card.invito:nth-child(3n+2) { grid-column: span 2; }
.invito-titolo { font-family: var(--display); font-size: 64px; line-height: 1; text-transform: uppercase; }
.invito-testo { font-size: 28px; font-weight: 600; color: var(--mist); }
.foto { grid-template-columns: minmax(0, 1fr) 1000px; gap: 70px; }
.foto-media { height: 790px; border-radius: 26px; overflow: hidden; border: 10px solid var(--white); box-shadow: 0 30px 70px rgba(11,42,110,.45); }
.foto-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.locandina { grid-template-columns: 1fr; place-items: center; padding: 20px 96px 40px; }
.locandina picture { display: contents; }
.slide.locandina.pieno { padding: 0; display: block; position: fixed; inset: 0; z-index: 5; background: #0b1640; }
.slide.locandina.pieno img, #stage.verticale .slide.locandina.pieno img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; border: 0; border-radius: 0; box-shadow: none; object-fit: contain; }
.locandina img { max-height: 830px; max-width: 100%; border-radius: 20px; border: 10px solid var(--white); box-shadow: 0 30px 70px rgba(11,42,110,.45); }
.post { grid-template-columns: 640px 1fr; gap: 90px; }
.post.con-immagine { grid-template-columns: 1fr 640px; }
.post-media { width: 640px; height: 800px; border-radius: 26px; overflow: hidden; background: var(--white); border: 10px solid var(--white); box-shadow: 0 30px 70px rgba(11,42,110,.45); }
.post-media img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 16px; background: var(--white); }
.post-caption { margin-top: 30px; font-size: 38px; line-height: 1.4; font-weight: 500; max-width: 32ch; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.post-date { font-size: 26px; color: var(--mist); margin-top: 26px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

footer { position: relative; z-index: 2; display: flex; align-items: center; background: var(--white); color: var(--navy); overflow: hidden; }
.footer-label { flex: none; height: 100%; display: flex; align-items: center; padding: 0 44px 0 80px; color: var(--blue); font-family: var(--display); font-size: 52px; text-transform: uppercase; }
.ticker { flex: 1; overflow: hidden; white-space: nowrap; }
.ticker-track { display: inline-block; padding-left: 100%; font-size: 32px; font-weight: 700; animation: scroll 60s linear infinite; }
.ticker-track span { margin-right: 90px; }
.ticker-track span::before { content: ""; display: inline-block; width: 40px; height: 5px; border-radius: 3px; background: var(--blue); margin-right: 22px; vertical-align: middle; }
@keyframes scroll { to { transform: translateX(-100%); } }

.progress { position: absolute; left: 0; bottom: 110px; height: 6px; background: var(--white); width: 0; z-index: 3; }
.dots { position: absolute; left: 50%; transform: translateX(-50%); bottom: 124px; display: flex; gap: 12px; z-index: 3; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.3); }
.dot.on { background: var(--white); }


/* senza avvisi: niente striscia in basso, più spazio ai contenuti */
#stage.senza-avvisi { grid-template-rows: 130px 1fr; }
#stage.senza-avvisi footer { display: none; }
#stage.senza-avvisi .progress { bottom: 0; height: 8px; }
#stage.senza-avvisi .dots { bottom: 26px; }
#stage.senza-avvisi::after { bottom: 0; }

/* tipografia più grande e d'impatto */
.slide { padding: 30px 100px 90px; gap: 80px; }
h1 { font-size: 172px; margin: 26px 0 34px; }
h1.lungo { font-size: 138px; }
.kicker { font-size: 30px; padding: 14px 32px; box-shadow: 0 10px 30px rgba(6,23,122,.35); }
.lead { font-size: 40px; }
.lead-row::before { width: 72px; height: 7px; margin-top: 24px; }
.facts { gap: 22px; }
.fact { padding: 30px 40px; border-radius: 24px; box-shadow: 0 18px 40px rgba(6,23,122,.30); }
.fact-label { font-size: 40px; }
.fact-note { font-size: 25px; margin-top: 8px; }
.fact-value { font-size: 88px; }
.fact-logo { background: #d9dee4; border-radius: 24px; display: grid; place-items: center; padding: 26px; box-shadow: 0 18px 40px rgba(6,23,122,.3); }
.fact-logo img { max-width: 100%; max-height: 200px; object-fit: contain; }
.facts.compact .fact-logo { padding: 18px; }
.facts.compact .fact-logo img { max-height: 150px; }
.facts.compact { gap: 16px; }
.facts.compact .fact { padding: 22px 36px; }
.facts.compact .fact-label { font-size: 34px; }
.chip { font-size: 28px; padding: 14px 28px; }
.cta { font-size: 32px; padding: 20px 36px; box-shadow: 0 14px 34px rgba(6,23,122,.35); }
.post-caption { font-size: 40px; }
.locandina img { height: 860px; width: auto; max-width: 100%; max-height: none; object-fit: contain; }
.foto-media, .post-media { height: 860px; }
.post-media { width: 688px; }
.post { grid-template-columns: 688px 1fr; }
.post.con-immagine { grid-template-columns: 1fr 688px; }

/* animazioni d'ingresso: ogni schermata "entra" per attirare lo sguardo */
@keyframes sali { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
@keyframes entra { from { opacity: 0; transform: translateX(90px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.6); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes zoom { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08); } }
.slide.active .kicker { animation: pop .7s cubic-bezier(.2,.8,.2,1) both; }
.slide.active h1 { animation: sali .8s .12s cubic-bezier(.2,.8,.2,1) both; }
.slide.active .lead-row, .slide.active .post-caption, .slide.active .post-date { animation: sali .8s .3s both; }
.slide.active .chips, .slide.active .cta, .slide.active .ig-row, .slide.active .ig-handle { animation: sali .8s .45s both; }
.slide.active .fact { animation: entra .75s cubic-bezier(.2,.8,.2,1) both; }
.slide.active .fact:nth-child(1) { animation-delay: .35s; }
.slide.active .fact:nth-child(2) { animation-delay: .5s; }
.slide.active .fact:nth-child(3) { animation-delay: .65s; }
.slide.active .fact:nth-child(4) { animation-delay: .8s; }
.slide.active .fact:nth-child(5) { animation-delay: .95s; }
.slide.active .post-media, .slide.active .foto-media, .slide.active .locandina img { animation: zoom .9s cubic-bezier(.2,.8,.2,1) both; }
.slide.active .sponsor-card, .slide.active .ig-tile { animation: pop .7s both; }
.slide.active .sponsor-card:nth-child(2), .slide.active .ig-tile:nth-child(2) { animation-delay: .12s; }
.slide.active .sponsor-card:nth-child(3), .slide.active .ig-tile:nth-child(3) { animation-delay: .24s; }
.slide.active .sponsor-card:nth-child(4), .slide.active .ig-tile:nth-child(4) { animation-delay: .36s; }
.slide.active .sponsor-card:nth-child(5), .slide.active .ig-tile:nth-child(5) { animation-delay: .48s; }
.slide.active .ig-tile:nth-child(6) { animation-delay: .6s; }
.slide.active .foto-media img, .slide.active .post-media img { animation: kenburns 16s ease-out both; }


/* ===== Schermi verticali (iPad, telefono): una colonna, tutto impilato ===== */
#stage.verticale header { padding: 0 60px; }
#stage.verticale .brand-sub { display: none; }
#stage.verticale .slide { grid-template-columns: 1fr !important; grid-template-rows: auto auto; align-content: center; gap: 50px; padding: 20px 70px 110px; }
#stage.verticale h1 { font-size: 150px; }
#stage.verticale h1.lungo { font-size: 124px; }
#stage.verticale .lead { max-width: none; }
#stage.verticale .post-media { width: 720px; height: 900px; justify-self: center; }
#stage.verticale .post.con-immagine .post-media { order: 2; }
#stage.verticale .foto-media { height: 640px; }
#stage.verticale .locandina img { width: 100%; height: auto; max-height: 1500px; }
#stage.verticale .sponsor-top { grid-template-columns: 1fr; gap: 20px; }
#stage.verticale .sponsor-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 260px; }
#stage.verticale .ig-grid { max-width: 900px; justify-self: center; width: 100%; }


/* Tema notte (campagna partnership): blu notte, vicino al blu del circolo ma diverso */
#stage .notte-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .9s ease;
  background: radial-gradient(60% 50% at 100% 80%, rgba(29,77,255,.35) 0%, rgba(29,77,255,0) 100%), linear-gradient(180deg, rgba(7,13,40,.78) 0%, rgba(10,20,64,.9) 40%, rgba(11,22,64,.97) 65%, #0b1640 100%), url("assets/sfondo.jpg") center top / cover no-repeat; }
#stage.notte .notte-layer { opacity: 1; }
#stage.notte::after { opacity: 0; }
.tema-notte .kicker { color: #0b1640; }
.tema-notte .fact { color: #0b1640; }
.tema-notte .fact-value, .tema-notte .fact-note { color: #1d4dff; }
.tema-notte .fact:last-child:not(:first-child) { background: #1d4dff; color: #fff; }
.tema-notte .fact:last-child:not(:first-child) .fact-value, .tema-notte .fact:last-child:not(:first-child) .fact-note { color: #dbe4ff; }
.tema-notte .cta { background: #1d4dff; color: #fff; }
/* Tema rosso (campagna preparazione atletica) */
#stage::before { z-index: 0; }
#stage .tema-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .9s ease;
  background: linear-gradient(180deg, rgba(168,10,24,.72) 0%, rgba(206,20,34,.86) 40%, rgba(212,22,36,.95) 65%, #d8172a 100%), url("assets/sfondo.jpg") center top / cover no-repeat; }
#stage.rosso .tema-layer { opacity: 1; }
/* foto di sfondo per una singola schermata (campo "sfondo"), velata di blu come la foto del circolo */
.foto-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity .9s ease; background-size: cover; background-position: center; }
.foto-layer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9,62,168,.94) 0%, rgba(10,86,206,.82) 45%, rgba(10,90,212,.55) 100%); }
#stage.rosso .foto-layer::after { background: linear-gradient(90deg, rgba(168,10,24,.94) 0%, rgba(206,20,34,.82) 45%, rgba(212,22,36,.55) 100%); }
.foto-layer.on { opacity: 1; }
header, main, footer { position: relative; z-index: 1; }
.tema-rosso .kicker { color: #d4162a; }
.tema-rosso .fact { color: #6e0a14; }
.tema-rosso .fact-value, .tema-rosso .fact-note { color: #d4162a; }
.tema-rosso .fact:last-child:not(:first-child) { background: #6e0a14; color: #fff; }
.tema-rosso .fact:last-child:not(:first-child) .fact-value, .tema-rosso .fact:last-child:not(:first-child) .fact-note { color: #f6d2d5; }
.tema-rosso .cta { background: #fff; color: #d4162a; font-family: var(--display); font-weight: 400; font-size: 56px; text-transform: uppercase; padding: 16px 40px; }
.facts.griglia { grid-template-columns: 1fr 1fr; }
.qrgrande { grid-template-columns: 1fr 620px; }
.qr-card { background: #fff; border-radius: 30px; padding: 40px; display: grid; gap: 22px; justify-items: center; box-shadow: 0 30px 70px rgba(6,23,122,.4); }
.qr-card img { width: 520px; height: 520px; image-rendering: pixelated; }
/* etichette social: colori delle piattaforme (per i loghi ufficiali usare le icone del brand kit di Meta) */
.kicker.social { color: #fff; }
.kicker.ig { background: linear-gradient(90deg, #f58529, #dd2a7b 45%, #8134af 75%, #515bd4); }
.kicker.wa { background: #25d366; color: #073b1d; }
.qr-card-testo.ig { color: #c13584; font-size: 54px; text-transform: none; }
.ig-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-top: 40px; }
.ig-strip .ig-tile { padding: 0; }
.qr-card-testo { font-family: var(--display); font-size: 58px; color: #128c4a; text-transform: uppercase; line-height: 1; }
.slide.active .qr-card { animation: pop .8s .3s both; }
#stage.verticale .qr-card { justify-self: center; }
#stage::after { transition: opacity .9s ease; }
#stage.rosso::after { opacity: 0; }
.slide.single.tema-rosso h1 { font-size: 168px; margin: 20px 0 26px; }
.slide.single.tema-rosso .lead { font-size: 46px; font-weight: 700; }
.facts.griglia .fact { padding: 34px 36px; }
.facts.griglia .fact:last-child:not(:first-child) { background: #fff; color: #6e0a14; }


.illustrazione { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); width: 820px; height: 820px; color: #fff; opacity: .16; pointer-events: none; z-index: 0; }
.illustrazione svg { width: 100%; height: 100%; }
.con-icona > *:not(.illustrazione) { position: relative; z-index: 1; }
.slide.single.con-icona .illustrazione { left: 74%; opacity: .2; }
.slide.active .illustrazione { animation: derive 18s ease-out both; }
@keyframes derive { from { transform: translate(-50%, -46%) rotate(-14deg) scale(.9); } to { transform: translate(-50%, -50%) rotate(-6deg) scale(1); } }
.kicker-icona { display: inline-flex; align-items: center; gap: 12px; }


/* Classifica sociale */
.classifica { grid-template-columns: 1fr; grid-template-rows: auto 1fr; align-items: stretch; gap: 34px; padding-top: 20px; }
.classifica .sponsor-top h1 { font-size: 120px; }
.rank-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); grid-auto-flow: column; gap: 16px 30px; }
.rank { display: grid; grid-template-columns: 80px 1fr auto auto; align-items: center; gap: 22px; background: #fff; color: var(--navy); border-radius: 18px; padding: 0 30px; box-shadow: 0 14px 30px rgba(6,23,122,.28); }
.rank-pos { font-family: var(--display); font-size: 52px; color: var(--blue); text-align: center; }
.rank-nome { font-size: 36px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

let nodes = [], idx = 0;

/* Fasce orarie: la bacheca mostra i contenuti adatti a chi è al circolo in quel momento.
   mattina 7–14 · pomeriggio 14–19 · sera 19–24 · weekend tutto il giorno (niente scuola tennis).
   Le schermate senza "fascia" girano sempre. */
function fasciaAttuale() {
  const forzata = new URLSearchParams(location.search).get("fascia");   // per prova: ?fascia=mattina
  if (forzata) return forzata;
  const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Rome" }));
  const g = d.getDay(), h = d.getHours();
  if (g === 0 || g === 6) return "weekend";
  if (h < 14) return "mattina";
  if (h < 19) return "pomeriggio";
  return "sera";
}
let FASCIA = null;

function build() {
  FASCIA = fasciaAttuale();
  const fa = fasciaAttuale();
  const oggiISO = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });
  const servizi = BACHECA.slide.filter(s => !s.finoAl || oggiISO <= s.finoAl).filter(s => !s.fascia || s.fascia.split(" ").includes(fa) || (fa === "weekend" && !/^pomeriggio$/.test(s.fascia))).map(s => {
    const n = (
    s.tipo === "instagram" ? renderInstagram() : s.tipo === "eventi" ? renderEventi() : s.tipo === "calendario" ? renderCalendario(BACHECA.calendario[s.indice]) :
    s.tipo === "sponsor" ? renderSponsor(s) : s.tipo === "foto" ? renderFoto(s) : s.tipo === "qrgrande" ? renderQrGrande(s) : s.tipo === "staff" ? renderStaff(s) : s.tipo === "video" ? renderVideo(s) : s.tipo === "videopieno" ? renderVideoPieno(s) : s.tipo === "galleria" ? renderGalleria(s) : s.tipo === "viaggi" ? renderViaggi(s) : renderTesto(s));
    if (n && s.durata) n.dataset.durata = s.durata;
    if (n && s.sfondo) n.dataset.sfondo = s.sfondo;
    if (n && s.tema) n.classList.add("tema-" + s.tema);
    if (n && s.icona && ICONE[s.icona]) { n.prepend(illustrazione(s.icona)); n.classList.add("con-icona"); }
    if (n && s.griglia) { const f = n.querySelector(".facts"); if (f) f.classList.add("griglia"); }
    return n;
  }).filter(Boolean);
  const recenti = POSTS.slice(0, BACHECA.postInRotazione).map(renderPost);
  // alterna: servizio, post, servizio, post...
  nodes = [];
  const n = Math.max(servizi.length, recenti.length);
  for (let k = 0; k < n; k++) { if (servizi[k]) nodes.push(servizi[k]); if (recenti[k]) nodes.push(recenti[k]); }
  if (CLASSIFICA && CLASSIFICA.categorie && CLASSIFICA.categorie.length) {
    const pos = nodes.findIndex(n => n.textContent.includes("vialadder.com"));
    const cl = CLASSIFICA.categorie.filter(c => (c.giocatori || []).length).map(c => renderClassifica(c, CLASSIFICA.aggiornata));
    const sal = CLASSIFICA.categorie.find(c => c.nome === "in salita");
    const sc = sal && renderScalata(sal, CLASSIFICA.aggiornata);
    if (sc) cl.unshift(sc);
    if (pos >= 0) nodes.splice(pos + 1, 0, ...cl);
  }
  // slide LIVE del torneo: subito all'inizio della rotazione e ripetute a metà giro
  const live = renderLiveSlides();
  if (live.length) { nodes.splice(1, 0, ...live); const meta = Math.floor(nodes.length / 2); nodes.splice(meta, 0, ...renderLiveSlides()); }
  // distribuisce le locandine (sponsor) a intervalli regolari nella rotazione
  const loc = BACHECA.locandine.map(renderLocandina);
  if (loc.length) {
    const passo = Math.max(2, Math.floor(nodes.length / loc.length));
    loc.forEach((l, k) => nodes.splice(Math.min(nodes.length, (k + 1) * passo + k), 0, l));
  }
  box.replaceChildren(...nodes);
  dots.replaceChildren(...nodes.map(() => el("div", "dot")));
  document.getElementById("ticker").replaceChildren(...BACHECA.avvisi.map(a => el("span", null, a)));
  document.getElementById("stage").classList.toggle("senza-avvisi", !BACHECA.avvisi.length);
}

function show(i) {
  nodes.forEach((n, k) => n.classList.toggle("active", k === i));
  [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  nodes.forEach((n, k) => n.querySelectorAll("video").forEach(v => {
    if (k === i) { try { if (v.dataset.vert) { const want = document.getElementById("stage").classList.contains("verticale") ? v.dataset.vert : v.dataset.oriz; if (v.getAttribute("src") !== want) v.src = want; } v.currentTime = 0; const p = v.play(); if (p) p.catch(() => {}); } catch (e) {} }
    else { try { v.pause(); } catch (e) {} }
  }));
  clearInterval(window._gal);
  const g = nodes[i].querySelector(".galleria-media");
  if (g) {
    const ims = [...g.querySelectorAll("img")]; let j = 0;
    ims.forEach((im, k) => im.classList.toggle("on", k === 0));
    const passo = Math.max(3, durata(nodes[i]) / ims.length);
    window._gal = setInterval(() => { ims[j].classList.remove("on"); j = (j + 1) % ims.length; ims[j].classList.add("on"); }, passo * 1000);
  }
  document.getElementById("stage").classList.toggle("rosso", nodes[i].classList.contains("tema-rosso"));
  document.getElementById("stage").classList.toggle("notte", nodes[i].classList.contains("tema-notte"));
  const fl = document.querySelector(".foto-layer");
  if (nodes[i].dataset.sfondo) { fl.style.backgroundImage = `url("${nodes[i].dataset.sfondo}")`; fl.classList.add("on"); }
  else fl.classList.remove("on");
  dots.style.visibility = (nodes[i].classList.contains("locandina") || nodes[i].classList.contains("foto") || nodes[i].classList.contains("galleria") || nodes[i].classList.contains("video-slide") || nodes[i].classList.contains("videopieno")) ? "hidden" : "visible";
  progress.style.transition = "none"; progress.style.width = "0";
  requestAnimationFrame(() => requestAnimationFrame(() => {
    progress.style.transition = `width ${durata(nodes[i])}s linear`;
    progress.style.width = "100%";
  }));
}

function durata(n) {
  if (n.dataset.durata) return +n.dataset.durata;
  if (n.classList.contains("locandina")) return n.classList.contains("pieno") ? 15 : BACHECA.durataLocandina;
  if (n.classList.contains("video-slide")) return 11;
  if (n.classList.contains("videopieno")) return 18;
  if (n.classList.contains("post") && !n.classList.contains("con-immagine")) return 11; // post Instagram: il testo lungo viene tagliato a schermo
  const parole = (n.textContent || "").trim().split(/\s+/).filter(Boolean).length;
  // circa 4 parole al secondo per chi legge da qualche metro, più qualche secondo per guardare
  const sec = Math.round(4 + parole / 4.5);
  return Math.min(BACHECA.durataMassima, Math.max(BACHECA.durataMinima, sec));
}

function prossima() {
  setTimeout(() => {
    idx = (idx + 1) % nodes.length;
    if (idx === 0 && fasciaAttuale() !== FASCIA) build();
    show(idx); prossima();
  }, durata(nodes[idx]) * 1000);
}


/* ===== LIVE torneo: legge live/torneo.json (aggiornato dai dati dell'app Rodeo Circolo) e aggiorna le slide senza ricaricare la pagina ===== */
let LIVE = null;
async function loadLive() {
  try { const r = await fetch("live/torneo.json?t=" + Date.now(), { cache: "no-store" }); LIVE = r.ok ? await r.json() : null; } catch (e) { /* tiene i dati precedenti */ }
}
function liveAttivo() {
  if (!LIVE || !LIVE.attivo) return false;
  const oggi = new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Rome" });
  return !LIVE.data || oggi <= LIVE.data;
}
function liveTesta(slide, titolo, sotto) {
  const top = el("div", "sponsor-top");
  const t = el("div");
  const k = el("div", "kicker live-kicker"); k.append(el("span", "live-dot"), document.createTextNode((LIVE.stato === "iscrizioni" ? "" : "Live · ") + (LIVE.nome || "Torneo")));
  t.append(k, el("h1", null, titolo));
  const lr = el("div", "lead-row"); lr.append(el("p", "lead", sotto));
  top.append(t, lr); slide.append(top);
}
function liveNews(slide) {
  const n = (LIVE.news || []).slice(-1)[0];
  if (n) { const d = el("div", "live-news"); d.append(el("b", null, "NEWS"), document.createTextNode(n)); slide.append(d); }
}
function riga(m, next) {
  const d = el("div", "live-match" + (next ? " next" : ""));
  d.append(el("div", "f", m.fase + (next && m.campo ? " · campo " + m.campo : "")));
  const v = el("div", "v");
  const A = m.vince === "a" ? el("b", null, m.a) : document.createTextNode(m.a);
  const B = m.vince === "b" ? el("b", null, m.b) : document.createTextNode(m.b);
  v.append(A, document.createTextNode("  –  "), B);
  d.append(v, el("div", "s", next ? "A seguire" : m.score));
  return d;
}
function renderLiveSlides() {
  if (!liveAttivo()) return [];
  const agg = LIVE.aggiornato ? "aggiornato alle " + LIVE.aggiornato : "";
  const out = [];
  if (LIVE.stato === "iscrizioni" || (!LIVE.gironi || !LIVE.gironi.length)) {
    const s = el("section", "slide live-slide"); s.dataset.live = "1"; s.dataset.durata = 14;
    const lib = Math.max(0, (LIVE.posti.max || 0) - (LIVE.posti.iscritti || 0));
    liveTesta(s, "Gli iscritti", lib ? "Ultimi " + lib + " posti: iscriviti in segreteria!" : "Tabellone al completo!");
    const g = el("div", "live-iscritti");
    (LIVE.iscritti || []).forEach(n => g.append(el("div", null, n)));
    for (let k = 0; k < lib; k++) g.append(el("div", "libero", "Posto libero"));
    s.append(g); liveNews(s); out.push(s);
    return out;
  }
  if (LIVE.campioni && LIVE.campioni.principale) {
    const s = el("section", "slide live-slide"); s.dataset.live = "1"; s.dataset.durata = 14;
    liveTesta(s, "I vincitori", "Complimenti a tutti i partecipanti!");
    const c = el("div", "live-campioni");
    const a = el("div", "c oro"); a.append(el("div", "t", "CAMPIONE · TABELLONE PRINCIPALE"), el("div", "w", LIVE.campioni.principale)); c.append(a);
    if (LIVE.campioni.consolazione) { const b = el("div", "c"); b.append(el("div", "t", "VINCITORE · CONSOLAZIONE"), el("div", "w", LIVE.campioni.consolazione)); c.append(b); }
    s.append(c); out.push(s);
  }
  { // gironi
    const s = el("section", "slide live-slide"); s.dataset.live = "1"; s.dataset.durata = 16;
    liveTesta(s, "Classifica gironi", agg);
    const g = el("div", "live-gironi");
    LIVE.gironi.forEach(gi => {
      const c = el("div", "live-card");
      const h = el("h3", null, gi.nome); h.append(el("small", null, gi.completo ? "CONCLUSO" : "IN CORSO")); c.append(h);
      const t = el("table", "live-tab");
      t.innerHTML = "<tr><th>Giocatore</th><th>G</th><th>V</th><th>+/-</th></tr>";
      gi.righe.forEach((r, k) => { const tr = el("tr", k < 2 ? "q" : ""); [r.n, r.g, r.v, (r.diff > 0 ? "+" : "") + r.diff].forEach((x, j) => tr.append(el("td", j === 0 ? "n" : null, String(x)))); t.append(tr); });
      c.append(t); g.append(c);
    });
    s.append(g); out.push(s);
  }
  if ((LIVE.risultati || []).length || (LIVE.prossime || []).length) {
    const s = el("section", "slide live-slide"); s.dataset.live = "1"; s.dataset.durata = 16;
    liveTesta(s, "Risultati in diretta", agg);
    const cols = el("div", "live-cols");
    const a = el("div", "live-col"); a.append(el("h3", null, "Ultimi risultati")); (LIVE.risultati || []).slice(0, 5).forEach(m => a.append(riga(m, false)));
    const b = el("div", "live-col"); b.append(el("h3", null, "Prossime partite")); (LIVE.prossime || []).slice(0, 5).forEach(m => b.append(riga(m, true)));
    cols.append(a, b); s.append(cols); liveNews(s); out.push(s);
  }
  const fp = (LIVE.finali && LIVE.finali.principale) || [], fc = (LIVE.finali && LIVE.finali.consolazione) || [];
  if (fp.length || fc.length) {
    const s = el("section", "slide live-slide"); s.dataset.live = "1"; s.dataset.durata = 14;
    liveTesta(s, "Fase finale", "Primi per il titolo · secondi per la consolazione");
    const cols = el("div", "live-cols");
    const a = el("div", "live-col"); a.append(el("h3", null, "Tabellone principale")); fp.forEach(m => a.append(riga(m, !m.score)));
    const b = el("div", "live-col"); b.append(el("h3", null, "Consolazione")); fc.forEach(m => b.append(riga(m, !m.score)));
    cols.append(a, b); s.append(cols); out.push(s);
  }
  return out;
}
setInterval(async () => {   // ogni minuto: nuovi dati live, sostituiti al volo nelle slide già presenti
  await loadLive();
  const vecchie = nodes.filter(n => n.dataset.live === "1");
  const nuove = renderLiveSlides();
  if (!nuove.length || !vecchie.length || vecchie.length % nuove.length !== 0) {
    if (nuove.length || vecchie.length) { const att = nodes[idx]; build(); idx = Math.max(0, nodes.indexOf(att)); if (idx >= nodes.length) idx = 0; show(idx); }
    return;
  }
  let pool = [];
  while (pool.length < vecchie.length) pool = pool.concat(renderLiveSlides());
  vecchie.forEach((v, k) => { v.replaceChildren(...pool[k].childNodes); v.dataset.durata = pool[k].dataset.durata; });
}, 60000);

async function loadPosts() {
  try {
    const rc = await fetch("classifica/classifica.json?t=" + Date.now(), { cache: "no-store" });
    if (rc.ok) CLASSIFICA = await rc.json();
  } catch (e) { CLASSIFICA = null; }
  try {
    const r = await fetch("instagram/posts.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) POSTS = (await r.json()).posts || [];
  } catch (e) { POSTS = []; }
  await loadLive();
}

(async () => {
  await loadPosts();
  build(); show(0);
  prossima();
})();

/* Aggiornamento automatico: ogni 5 minuti controlla se la bacheca o i post sono cambiati e si ricarica */
const firme = {};
async function firma(url) {
  try { const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" }); return r.ok ? (await r.text()) : null; }
  catch (e) { return null; }
}
async function controllaAggiornamenti() {
  for (const url of ["index.html", "instagram/posts.json", "classifica/classifica.json"]) {
    const t = await firma(url);
    if (t == null) continue;
    if (firme[url] != null && firme[url] !== t) {
      firme[url] = t;
      if (url === "index.html") { location.reload(); return; }
      // post o classifica nuovi: aggiorna le slide senza ricaricare (così la musica non si ferma)
      await loadPosts(); const att = nodes[idx]; build(); idx = Math.max(0, nodes.indexOf(att)); if (idx >= nodes.length) idx = 0; show(idx);
      continue;
    }
    firme[url] = t;
  }
}
controllaAggiornamenti();
setInterval(controllaAggiornamenti, 5 * 60 * 1000);
/* ricarica comunque una volta a notte, per sicurezza */
setInterval(async () => {   // ricarica di sicurezza ogni 6 ore, solo se internet c'è
  try { const r = await fetch("index.html?t=" + Date.now(), { cache: "no-store" }); if (r.ok) location.reload(); } catch (e) {}
}, 6 * 60 * 60 * 1000);


/* ===== Meteo: Open-Meteo, gratuito e senza chiave. Coordinate del circolo. ===== */
const METEO = { lat: 41.8986, lon: 12.4486 };
function iconaMeteo(code, notte) {
  const st = 'fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
  const sole = notte ? '<path d="M58 22a24 24 0 1 0 22 32 20 20 0 0 1-22-32z" ' + st + '/>'
    : '<circle cx="50" cy="50" r="17" ' + st + '/><path d="M50 14v9M50 77v9M14 50h9M77 50h9M24 24l6 6M70 70l6 6M24 76l6-6M70 30l6-6" ' + st + '/>';
  const nuvola = '<path d="M30 74h42a16 16 0 0 0 0-32 22 22 0 0 0-42 6 13 13 0 0 0 0 26z" ' + st + '/>';
  const gocce = '<path d="M38 82l-4 9M52 82l-4 9M66 82l-4 9" ' + st + '/>';
  const fiocchi = '<path d="M38 86h0M52 90h0M66 86h0" stroke="#fff" stroke-width="8" stroke-linecap="round"/>';
  const lampo = '<path d="M54 70l-10 14h12l-8 12" ' + st + '/>';
  let g;
  if (code === 0) g = sole;
  else if (code <= 2) g = '<g transform="translate(-14 -14) scale(.8)">' + sole + '</g>' + nuvola;
  else if (code === 3 || code === 45 || code === 48) g = nuvola;
  else if (code >= 95) g = nuvola + lampo;
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) g = nuvola + fiocchi;
  else g = nuvola + gocce;
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + g + '</svg>';
}
async function aggiornaMeteo() {
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + METEO.lat + "&longitude=" + METEO.lon +
      "&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&forecast_hours=12&timezone=Europe%2FRome";
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    const box = document.getElementById("meteo");
    const ora = el("div", "meteo-ora");
    ora.innerHTML = iconaMeteo(d.current.weather_code, !d.current.is_day);
    ora.append(el("div", "meteo-temp", Math.round(d.current.temperature_2m) + "°"));
    const prev = el("div", "meteo-prev");
    const adesso = Date.now();
    let n = 0;
    d.hourly.time.forEach((t, k) => {
      const ts = new Date(t + ":00+01:00").getTime();
      if (ts <= adesso || n >= 4 || (k % 2)) return;   // ogni 2 ore, 4 previsioni
      const h = el("div", "meteo-h");
      h.append(el("span", null, t.slice(11, 13)));
      const ic = el("div"); ic.innerHTML = iconaMeteo(d.hourly.weather_code[k], !d.hourly.is_day[k]); h.append(ic.firstChild);
      h.append(el("b", null, Math.round(d.hourly.temperature_2m[k]) + "°"));
      prev.append(h); n++;
    });
    box.replaceChildren(ora, prev);
  } catch (e) { /* senza rete il meteo resta nascosto */ }
}
aggiornaMeteo();
setInterval(aggiornaMeteo, 30 * 60 * 1000);

function tick() {
  const d = new Date();
  document.getElementById("time").textContent = d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Rome" });
  document.getElementById("date").textContent = d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long", timeZone: "Europe/Rome" });
}
tick(); setInterval(tick, 10000);

/* Riempie sempre tutto lo schermo: la bacheca si allarga o si alza per adattarsi
   alle proporzioni dello schermo, senza bande ai lati */
function fit() {
  const w = window.innerWidth, h = window.innerHeight;
  const verticale = h > w * 1.05;           // iPad o telefono in verticale
  const s = verticale ? Math.min(w / 1080, h / 1920) : Math.min(w / 1920, h / 1080);
  const st = document.getElementById("stage");
  st.classList.toggle("verticale", verticale);
  st.style.width = (w / s) + "px";
  st.style.height = (h / s) + "px";
  st.style.transform = `translate(-50%, -50%) scale(${s})`;
}
/* Un clic (o il tasto OK del telecomando) mette la pagina a schermo intero */
function schermoIntero() {
  const d = document.documentElement;
  try {
    if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen().catch(() => {});
    else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
  } catch (e) {}
}
document.addEventListener("click", schermoIntero);
document.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === "f") schermoIntero(); });
fit(); window.addEventListener("resize", fit);

// Tiene acceso lo schermo (Fire TV con Silk, tablet): chiede al browser di non andare in sospensione
let wakeLockBacheca = null;
async function tieniAcceso() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") wakeLockBacheca = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", tieniAcceso);
// Tutto schermo: basta premere OK sul telecomando (o toccare lo schermo) una volta
function tuttoSchermo() {
  const d = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  try { const r = (d.requestFullscreen || d.webkitRequestFullscreen).call(d, { navigationUI: "hide" }); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}

// Musica di sottofondo: brani originali che si alternano. Parte alla prima pressione di OK (i browser bloccano l'audio automatico).
// Per spegnerla: aggiungi ?musica=0 all'indirizzo.
const MUSICA = ["assets/musica/reception-1.m4a", "assets/musica/reception-2.m4a", "assets/musica/reception-3.m4a"];
// Radio in diretta (RTL 102.5). Se lo streaming non risponde, si passa da soli ai brani di sottofondo.
const RADIO = "https://streamingv2.shoutcast.com/rtl-1025";
const musica = (() => {
  const q = new URLSearchParams(location.search).get("musica");
  if (q === "0") return null;
  const a = new Audio(); a.volume = 0.4; a.preload = "none";
  let i = Math.floor(Math.random() * MUSICA.length), radio = q !== "brani";
  const carica = () => { a.src = radio ? RADIO : MUSICA[i]; };
  let tentativi = 0;
  const aiBrani = () => {
    if (!radio) return;
    const suonava = !a.paused || a.dataset.voluto === "1";
    if (tentativi < 3) { tentativi++; setTimeout(() => { a.src = RADIO + "?r=" + Date.now(); if (suonava) a.play().catch(() => {}); }, 4000); return; }   // la radio si è interrotta: riprova
    radio = false; carica(); if (suonava) a.play().catch(() => {});
    setTimeout(() => { radio = true; tentativi = 0; }, 20 * 60 * 1000);   // dopo 20 minuti, al cambio brano, ritenta la radio
  };
  a.addEventListener("error", aiBrani);
  a.addEventListener("stalled", () => { if (radio) setTimeout(() => { if (radio && a.readyState < 3) aiBrani(); }, 8000); });
  a.addEventListener("playing", () => { if (radio) tentativi = 0; });
